<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar perfil — Umbral</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-top-bar">
        <a href="perfil.html" class="btn-secondary">← Volver al perfil</a>
      </div>

      <h1>✏️ Editar perfil</h1>
      <p class="auth-subtitle">Actualiza tus datos, foto, banner y encuadre</p>

      <form id="edit-profile-form" class="form-grid" novalidate>
        <div class="field">
          <label for="edit-username">Apodo / Nombre de usuario</label>
          <input id="edit-username" type="text" required />
        </div>

        <div class="field">
          <label for="edit-short-desc">Descripción corta / Lo que te apasiona</label>
          <input id="edit-short-desc" type="text" />
        </div>

        <div id="edit-creator-fields" class="form-grid" style="display: none;">
          <div class="field">
            <label for="edit-channel">Nombre de canal o proyecto</label>
            <input id="edit-channel" type="text" />
          </div>

          <div class="field">
            <label for="edit-socials">Redes sociales o enlaces</label>
            <input id="edit-socials" type="text" />
          </div>

          <div class="field">
            <label for="edit-bio">Biografía de creador</label>
            <textarea id="edit-bio" rows="3"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="edit-avatar-file">Cambiar foto de perfil (máx. 2 MB)</label>
          <input id="edit-avatar-file" type="file" accept="image/*" />

          <div id="edit-crop-stage" class="avatar-crop-stage" style="display: none;">
            <img id="edit-crop-img" alt="Vista previa de recorte de perfil" />
          </div>

          <div class="field" style="display: none;">
            <label for="edit-zoom-range">Zoom / encuadre (arrastra la foto para centrar)</label>
            <input
              id="edit-zoom-range"
              type="range"
              min="1"
              max="3"
              step="0.05"
              value="1"
            />
          </div>
        </div>

        <div class="field">
          <label for="edit-banner-file">Foto de banner (opcional, máx. 2 MB)</label>
          <input id="edit-banner-file" type="file" accept="image/*" />
          <div id="edit-banner-preview" class="banner-upload-preview">
            <img id="edit-banner-img" alt="Vista previa del banner" />
          </div>
        </div>

        <p id="edit-error" class="form-error" style="display: none;"></p>

        <button type="submit" class="btn-primary">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
